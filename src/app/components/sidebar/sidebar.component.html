<div style="width: 250px; min-height: 100vh; background: #061449; color: white; position: fixed; left: 0; top: 0; display: flex; flex-direction: column; box-shadow: 2px 0 10px rgba(0,0,0,0.1); z-index: 1000;">

    <!-- LOGO -->
    <div style="padding: 25px 20px; text-align: center; border-bottom: 1px solid rgba(255,255,255,0.1);">
        <div style="width: 60px; height: 60px; background: white; border-radius: 50%; margin: 0 auto 10px; display: flex; align-items: center; justify-content: center; font-size: 24px; font-weight: 800; color: #061449;">
            F
        </div>
        <h2 style="color: white; font-size: 20px; margin: 0; letter-spacing: 2px;">FLY2US</h2>
        <p style="color: rgba(255,255,255,0.5); font-size: 10px; letter-spacing: 2px; text-transform: uppercase; margin-top: 4px;">Visa Services</p>
    </div>

    <!-- ========================================== -->
    <!-- MENU CLIENT -->
    <!-- ========================================== -->
    <nav *ngIf="role !== 'ADMIN'" style="flex: 1; padding: 20px 15px; overflow-y: auto;">
        <a routerLink="/dashboard" routerLinkActive="active"
           style="display: block; padding: 12px 16px; color: rgba(255,255,255,0.6); text-decoration: none; border-radius: 8px; margin-bottom: 4px; font-weight: 500; transition: 0.3s;">
            🏠 Accueil
        </a>

        <p style="color: rgba(255,255,255,0.3); font-size: 11px; text-transform: uppercase; letter-spacing: 2px; padding: 10px 16px 5px; font-weight: 600;">Mes Dossiers</p>

        <a routerLink="/client/my-dossiers" routerLinkActive="active"
           style="display: block; padding: 12px 16px; color: rgba(255,255,255,0.6); text-decoration: none; border-radius: 8px; margin-bottom: 4px; font-weight: 500; transition: 0.3s;">
            📋 Mes Dossiers
        </a>
        <a routerLink="/client/dossiers/create" routerLinkActive="active"
           style="display: block; padding: 12px 16px; color: rgba(255,255,255,0.6); text-decoration: none; border-radius: 8px; margin-bottom: 4px; font-weight: 500; transition: 0.3s;">
            ➕ Nouveau Dossier
        </a>

        <p style="color: rgba(255,255,255,0.3); font-size: 11px; text-transform: uppercase; letter-spacing: 2px; padding: 10px 16px 5px; font-weight: 600;">Compte</p>

        <a href="#" style="display: block; padding: 12px 16px; color: rgba(255,255,255,0.6); text-decoration: none; border-radius: 8px; margin-bottom: 4px; font-weight: 500; transition: 0.3s;">
            👤 Mon Profil
        </a>
        <a href="#" style="display: block; padding: 12px 16px; color: rgba(255,255,255,0.6); text-decoration: none; border-radius: 8px; margin-bottom: 4px; font-weight: 500; transition: 0.3s;">
            💰 Mes Paiements
        </a>
    </nav>

    <!-- ========================================== -->
    <!-- MENU ADMIN -->
    <!-- ========================================== -->
    <nav *ngIf="role === 'ADMIN'" style="flex: 1; padding: 20px 15px; overflow-y: auto;">
        <a routerLink="/admin/dashboard" routerLinkActive="active"
           style="display: block; padding: 12px 16px; color: rgba(255,255,255,0.6); text-decoration: none; border-radius: 8px; margin-bottom: 4px; font-weight: 500; transition: 0.3s;">
            📊 Dashboard
        </a>

        <p style="color: rgba(255,255,255,0.3); font-size: 11px; text-transform: uppercase; letter-spacing: 2px; padding: 10px 16px 5px; font-weight: 600;">Gestion</p>

        <a routerLink="/admin/users" routerLinkActive="active"
           style="display: block; padding: 12px 16px; color: rgba(255,255,255,0.6); text-decoration: none; border-radius: 8px; margin-bottom: 4px; font-weight: 500; transition: 0.3s;">
            👥 Utilisateurs
        </a>
        <a routerLink="/admin/dossiers" routerLinkActive="active"
           style="display: block; padding: 12px 16px; color: rgba(255,255,255,0.6); text-decoration: none; border-radius: 8px; margin-bottom: 4px; font-weight: 500; transition: 0.3s;">
            📋 Tous les Dossiers
        </a>
        <a routerLink="/admin/documents" routerLinkActive="active"
           style="display: block; padding: 12px 16px; color: rgba(255,255,255,0.6); text-decoration: none; border-radius: 8px; margin-bottom: 4px; font-weight: 500; transition: 0.3s;">
            📄 Documents Requis
        </a>
        <a routerLink="/admin/visas" routerLinkActive="active"
           style="display: block; padding: 12px 16px; color: rgba(255,255,255,0.6); text-decoration: none; border-radius: 8px; margin-bottom: 4px; font-weight: 500; transition: 0.3s;">
            🛂 Gestion Visas
        </a>

        <!-- ✅ NOUVEAU : Section Paiements -->
        <p style="color: rgba(255,255,255,0.3); font-size: 11px; text-transform: uppercase; letter-spacing: 2px; padding: 10px 16px 5px; font-weight: 600;">Paiements</p>

        <a routerLink="/admin/tarifs" routerLinkActive="active"
           style="display: block; padding: 12px 16px; color: rgba(255,255,255,0.6); text-decoration: none; border-radius: 8px; margin-bottom: 4px; font-weight: 500; transition: 0.3s;">
            💰 Tarifs
        </a>
        <a routerLink="/admin/paiements" routerLinkActive="active"
           style="display: block; padding: 12px 16px; color: rgba(255,255,255,0.6); text-decoration: none; border-radius: 8px; margin-bottom: 4px; font-weight: 500; transition: 0.3s;">
            💳 Paiements
        </a>
    </nav>

    <!-- DÉCONNEXION -->
    <div style="padding: 20px; border-top: 1px solid rgba(255,255,255,0.1);">
        <a (click)="logout()" style="display: block; padding: 12px 16px; color: rgba(255,255,255,0.5); text-decoration: none; border-radius: 8px; transition: 0.3s; font-weight: 500; cursor: pointer;">
            🚪 Déconnexion
        </a>
    </div>
</div>
