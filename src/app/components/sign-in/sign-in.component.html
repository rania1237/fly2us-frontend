<div style="min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #f0f4ff; padding: 20px;">
    <div style="background: white; border-radius: 20px; padding: 50px 40px; width: 100%; max-width: 420px; box-shadow: 0 10px 40px rgba(0,0,0,0.08);">
        
        <!-- LOGO -->
        <div style="text-align: center; margin-bottom: 30px;">
            <img src="assets/logo.jpg" alt="Fly2US Logo" 
                 style="width: 80px; height: 80px; border-radius: 50%; object-fit: cover; margin: 0 auto 12px; display: block; border: 3px solid #061449;">
            
            <h1 style="color: #061449; font-size: 28px; font-weight: 700; margin: 0; letter-spacing: 2px; font-family: Arial, sans-serif;">FLY2US</h1>
            <p style="color: #666; font-size: 12px; letter-spacing: 3px; text-transform: uppercase; margin-top: 4px; font-weight: 600;">Visa Services</p>
            <h2 style="color: #061449; font-size: 22px; font-weight: 600; margin-top: 20px; font-family: Arial, sans-serif;">Welcome Back</h2>
            <p style="color: #888; font-size: 15px; margin-top: 4px;">Sign in to manage your visa applications</p>
        </div>
        
        <!-- MESSAGE D'ERREUR -->
        <div *ngIf="errorMessage" style="background: #fee; color: #bb0019; padding: 12px; border-radius: 8px; margin-bottom: 16px; border: 1px solid #ffcccc; text-align: center;">
            {{ errorMessage }}
        </div>
        
        <!-- FORMULAIRE -->
        <form (ngSubmit)="onSubmit()">
            <div style="margin-bottom: 16px;">
                <label style="display: block; font-weight: 600; font-size: 13px; color: #333; margin-bottom: 6px;">Email Address</label>
                <input [(ngModel)]="email" name="email" type="email" required
                       style="width: 100%; padding: 14px 16px; background: #f5f7fa; border: 2px solid #e8ecf1; border-radius: 10px; font-size: 15px; outline: none; box-sizing: border-box;"
                       placeholder="student@university.edu">
            </div>
            
            <div style="margin-bottom: 20px;">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
                    <label style="font-weight: 600; font-size: 13px; color: #333;">Password</label>
                    <a href="#" style="font-weight: 600; font-size: 13px; color: #bb0019; text-decoration: none;">Forgot?</a>
                </div>
                <div style="position: relative;">
                    <input [(ngModel)]="password" name="password" [type]="showPassword ? 'text' : 'password'" required
                           style="width: 100%; padding: 14px 16px; background: #f5f7fa; border: 2px solid #e8ecf1; border-radius: 10px; font-size: 15px; outline: none; box-sizing: border-box;"
                           placeholder="Enter your password">
                    <button type="button" (click)="togglePassword()"
                            style="position: absolute; right: 14px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; font-size: 18px; color: #999;">
                        {{ showPassword ? '🙈' : '👁️' }}
                    </button>
                </div>
            </div>
            
            <button type="submit" [disabled]="loading"
                    style="width: 100%; background: #061449; color: white; font-weight: 700; font-size: 16px; padding: 16px; border-radius: 10px; border: none; cursor: pointer; transition: background 0.3s;">
                <span *ngIf="!loading">Sign In →</span>
                <span *ngIf="loading">⏳ Please wait...</span>
            </button>
        </form>
        
        <p style="margin-top: 20px; text-align: center; color: #888; font-size: 14px;">
            New here? <a routerLink="/signup" style="font-weight: 700; color: #bb0019; text-decoration: none;">Create Account</a>
        </p>
    </div>
</div>
