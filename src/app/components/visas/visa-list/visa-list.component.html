<div style="
padding:20px;
background:#f0f4ff;
min-height:100vh;
margin-left:250px;
">


<h1 style="color:#061449;">
🛂 Gestion des Visas
</h1>



<button
(click)="addVisa()"

style="
background:#061449;
color:white;
padding:10px 20px;
border:none;
border-radius:8px;
cursor:pointer;
">

➕ Ajouter un visa

</button>




<div *ngIf="loading">

Chargement...

</div>




<div *ngIf="errorMessage"
style="color:red;">

{{errorMessage}}

</div>






<div
*ngFor="let visa of visas"

style="
background:white;
padding:15px;
margin:15px 0;
border-radius:8px;
display:flex;
justify-content:space-between;
align-items:center;
">





<div>

<strong>

{{visa.flag}}
{{visa.country}}

</strong>


<br>


<span>

Type :
{{visa.type}}

</span>


</div>






<div>


<button
(click)="detailsVisa(visa.id!)"

style="
background:#f59e0b;
color:white;
padding:7px 15px;
border:none;
border-radius:5px;
margin-right:5px;
cursor:pointer;
">

👁 Voir

</button>





<button
(click)="deleteVisa(visa.id!)"

style="
background:#ef4444;
color:white;
padding:7px 15px;
border:none;
border-radius:5px;
cursor:pointer;
">

🗑 Supprimer

</button>




</div>





</div>



</div>
