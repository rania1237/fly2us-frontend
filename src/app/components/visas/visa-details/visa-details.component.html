<div style="padding: 20px; background: #f0f4ff; min-height: 100vh; margin-left: 250px;">
    <h1 style="color: #061449;">📋 Détails du Visa</h1>
    <button (click)="goBack()" style="background: #6b7280; color: white; padding: 10px 20px; border: none; border-radius: 8px; cursor: pointer;">
        ← Retour
    </button>

    <div *ngIf="visa" style="background: white; padding: 20px; border-radius: 8px; margin-top: 20px;">
        <p><strong>Type :</strong> {{ visa.type }}</p>
        <p><strong>Pays :</strong> {{ visa.flag }} {{ visa.country }}</p>
        <p><strong>Description :</strong> {{ visa.description }}</p>
        <p><strong>Durée :</strong> {{ visa.duration }}</p>
        <p><strong>Délai :</strong> {{ visa.processingTime }}</p>
        <p><strong>Prix :</strong> {{ visa.price }} €</p>
    </div>
</div>
