<div style="min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #f0f4ff; padding: 20px;">
    <div style="background: white; border-radius: 20px; padding: 50px 40px; width: 100%; max-width: 480px; box-shadow: 0 10px 40px rgba(0,0,0,0.08);">
        
        <!-- LOGO -->
        <div style="text-align: center; margin-bottom: 30px;">
            <img src="assets/logo.jpg" alt="Fly2US Logo" 
                 style="width: 80px; height: 80px; border-radius: 50%; object-fit: cover; margin: 0 auto 12px; display: block; border: 3px solid #061449;">
            <h1 style="color: #061449; font-size: 28px; font-weight: 700; margin: 0; letter-spacing: 2px; font-family: Arial, sans-serif;">FLY2US</h1>
            <p style="color: #666; font-size: 12px; letter-spacing: 3px; text-transform: uppercase; margin-top: 4px; font-weight: 600;">Visa Services</p>
            <h2 style="color: #061449; font-size: 22px; font-weight: 600; margin-top: 20px; font-family: Arial, sans-serif;">Create Account</h2>
            <p style="color: #888; font-size: 15px; margin-top: 4px;">Start your journey with Fly2US</p>
        </div>

        <!-- MESSAGES -->
        <div *ngIf="successMessage" style="background: #e6ffe6; color: #059669; padding: 12px; border-radius: 8px; margin-bottom: 16px; border: 1px solid #b3ffb3; text-align: center;">
            {{ successMessage }}
        </div>
        <div *ngIf="errorMessage" style="background: #fee; color: #bb0019; padding: 12px; border-radius: 8px; margin-bottom: 16px; border: 1px solid #ffcccc; text-align: center;">
            {{ errorMessage }}
        </div>

        <!-- FORMULAIRE -->
        <form (ngSubmit)="onSubmit()">
            <div style="margin-bottom: 14px;">
                <label style="display: block; font-weight: 600; font-size: 13px; color: #333; margin-bottom: 6px;">Full Name</label>
                <input [(ngModel)]="user.fullName" name="fullName" type="text" required
                       style="width: 100%; padding: 14px 16px; background: #f5f7fa; border: 2px solid #e8ecf1; border-radius: 10px; font-size: 15px; outline: none; box-sizing: border-box;"
                       placeholder="John Doe">
            </div>

            <div style="margin-bottom: 14px;">
                <label style="display: block; font-weight: 600; font-size: 13px; color: #333; margin-bottom: 6px;">Email Address</label>
                <input [(ngModel)]="user.email" name="email" type="email" required
                       style="width: 100%; padding: 14px 16px; background: #f5f7fa; border: 2px solid #e8ecf1; border-radius: 10px; font-size: 15px; outline: none; box-sizing: border-box;"
                       placeholder="john@example.com">
            </div>

            <div style="margin-bottom: 14px;">
                <label style="display: block; font-weight: 600; font-size: 13px; color: #333; margin-bottom: 6px;">Phone Number</label>
                <input [(ngModel)]="user.phone" name="phone" type="text"
                       style="width: 100%; padding: 14px 16px; background: #f5f7fa; border: 2px solid #e8ecf1; border-radius: 10px; font-size: 15px; outline: none; box-sizing: border-box;"
                       placeholder="+21600000000">
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 14px;">
                <div>
                    <label style="display: block; font-weight: 600; font-size: 13px; color: #333; margin-bottom: 6px;">Password</label>
                    <input [(ngModel)]="user.password" name="password" type="password" required
                           style="width: 100%; padding: 14px 16px; background: #f5f7fa; border: 2px solid #e8ecf1; border-radius: 10px; font-size: 15px; outline: none; box-sizing: border-box;"
                           placeholder="••••••••">
                </div>
                <div>
                    <label style="display: block; font-weight: 600; font-size: 13px; color: #333; margin-bottom: 6px;">Confirm</label>
                    <input [(ngModel)]="user.confirmPassword" name="confirmPassword" type="password" required
                           style="width: 100%; padding: 14px 16px; background: #f5f7fa; border: 2px solid #e8ecf1; border-radius: 10px; font-size: 15px; outline: none; box-sizing: border-box;"
                           placeholder="••••••••">
                </div>
            </div>

            <div style="display: flex; align-items: flex-start; gap: 10px; margin: 16px 0 20px;">
                <input type="checkbox" style="margin-top: 3px; width: 18px; height: 18px; accent-color: #061449; cursor: pointer;">
                <label style="font-size: 13px; color: #888; cursor: pointer;">
                    I agree to the 
                    <a href="#" style="color: #061449; font-weight: 600; text-decoration: none;">Terms</a>
                    &amp; 
                    <a href="#" style="color: #061449; font-weight: 600; text-decoration: none;">Privacy Policy</a>
                </label>
            </div>

            <button type="submit" [disabled]="loading"
                    style="width: 100%; background: #bb0019; color: white; font-weight: 700; font-size: 16px; padding: 16px; border-radius: 10px; border: none; cursor: pointer; transition: background 0.3s;">
                <span *ngIf="!loading">Create Account →</span>
                <span *ngIf="loading">⏳ Creating...</span>
            </button>
        </form>

        <p style="margin-top: 20px; text-align: center; color: #888; font-size: 14px;">
            Already have an account? 
            <a routerLink="/signin" style="font-weight: 700; color: #061449; text-decoration: none;">Sign In</a>
        </p>
    </div>
</div>
